<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icons/app-icon.svg" />
		<link rel="preload" href="%sveltekit.assets%/fonts/inter/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/icon-180.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#bf2732" />
		<meta name="application-name" content="ShaderLab" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="ShaderLab" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<script>
			// Flags scripting before the first paint, so the prerendered markup can hide
			// its reveal targets instead of flashing them in and out during hydration.
			document.documentElement.dataset.motion = 'on';
		</script>
		<script>
			if ('serviceWorker' in navigator && location.protocol === 'https:') {
				navigator.serviceWorker.register('%sveltekit.assets%/sw.js').catch(() => {});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
